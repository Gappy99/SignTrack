version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: authserviceSIGNTRACK_postgres
    restart: always
    environment:
      POSTGRES_DB: SignTrack
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin
    ports:
     - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: signtrack_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
