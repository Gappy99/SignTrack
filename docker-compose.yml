version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: signtrack_postgres
    restart: always
    environment:
      POSTGRES_DB: SignTrack
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: signtrack_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
