# coturn — TURN/STUN para videollamadas entre redes
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
# Credenciales estáticas (deben coincidir con WebRtc__IceServers en .env.prod)
user=signtrack:CHANGE_ME_TURN_PASSWORD
realm=signtrack.example.com
server-name=signtrack.example.com
total-quota=100
stale-nonce=600
no-multicast-peers
no-cli
log-file=stdout

# En VPS/casa: descomentar y poner IP pública
# external-ip=TU_IP_PUBLICA
